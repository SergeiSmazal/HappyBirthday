<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "htt`://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xml:lang="en" xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Happy Birthday!</title>     
    <link type="text/css" rel="stylesheet" href="./css/default.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <script type="text/javascript" src="./css/jquery.min.js"></script>
    <script type="text/javascript" src="./css/jscex.min.js"></script>
    <script type="text/javascript" src="./css/jscex-parser.js"></script>
    <script type="text/javascript" src="./css/jscex-jit.js"></script>
    <script type="text/javascript" src="./css/jscex-builderbase.min.js"></script>
    <script type="text/javascript" src="./css/jscex-async.min.js"></script>
    <script type="text/javascript" src="./css/jscex-async-powerpack.min.js"></script>
    <script type="text/javascript" src="./css/functions.js" charset="utf-8"></script>
    <script type="text/javascript" src="./css/love.js" charset="utf-8"></script>
      <style type="text/css">
<!--
.STYLE1 {color: #666666}
-->
        </style>
</head>
    <body>
      <audio autoplay="autopaly">
          <source src="music/love.mp3" type="audio/mp3" />
      </audio>  
        <div id="main">
             <div id="wrap">
                <div id="text">
              <div id="code">
                  <div class="poem-line" style="display:none;">
                      <div class="zh-text">在天愿作比翼鸟，</div>
                      <div class="en-text">In heaven, we wish to be birds flying wing to wing,</div>
                  </div>
                  <div class="poem-line" style="display:none;">
                      <div class="zh-text">在地愿为连理枝。</div>
                      <div class="en-text">On earth, we wish to be trees with intertwined branches.</div>
                  </div>
                  <div class="poem-line" style="display:none;">
                      <div class="zh-text">天长地久有时尽，</div>
                      <div class="en-text">Even if heaven and earth may one day pass away,</div>
                  </div>
                  <div class="poem-line" style="display:none;">
                      <div class="zh-text">此恨绵绵无绝期。</div>
                      <div class="en-text">Our love and this depth of feeling shall never end.</div>
                  </div>
                  <div class="footer-info">
                      <span class="author">-- by Bai Juyi --</span>
                      <h1>Happy Birthday, my Love!</h1>
                  </div>
              </div>
              </div>
              <div id="clock-box">
              <span class="STYLE1"></span>
              <font color="#33CC00"></font>
              <span class="STYLE1"></span>
              </div>
              <canvas id="canvas" width="1100" height="680"></canvas>
              </div>

              </div>

              <script>
              </script>

              <script>
              (function(){
              var canvas = $('#canvas');

              if (!canvas[0].getContext) {
              $("#error").show();
              return false;        }

              var width = canvas.width();
              var height = canvas.height();        
              var opts = {
              seed: {
              x: width / 2 - 20,
              color: "rgb(190, 26, 37)",
              scale: 2
              },
              branch: [
              // Изменили Y-координаты старта с 680 на 650
              [535, 650, 570, 220, 500, 170, 30, 100, [
                  [540, 470, 455, 387, 340, 370, 13, 100, [
                      [450, 405, 434, 400, 394, 365, 2, 40]
                  ]],
                  [550, 415, 600, 326, 680, 315, 12, 100, [
                      [578, 370, 648, 379, 661, 396, 3, 80]
                  ]],
                  [539, 251, 537, 218, 534, 187, 3, 40],
                  [546, 367, 413, 217, 328, 214, 9, 80, [
                      [427, 256, 383, 223, 371, 175, 2, 40],
                      [498, 315, 435, 285, 395, 300, 4, 60]
                  ]],
                  [546, 327, 608, 222, 678, 191, 6, 100, [
                      [590, 263, 646, 247, 648, 241, 2, 80]
                  ]]
              ]] 
              ],
              bloom: {
              num: 700,
              width: 1080,
              height: 620,
              },
              footer: {
              width: 1200,
              height: 5,
              speed: 10,
              }
              }


              var tree = new Tree(canvas[0], width, height, opts);
              var seed = tree.seed;
              var foot = tree.footer;
              var hold = 1;

              canvas.click(function(e) {
              var offset = canvas.offset(), x, y;
              x = e.pageX - offset.left;
              y = e.pageY - offset.top;
              if (seed.hover(x, y)) {
              hold = 0; 
              canvas.unbind("click");
              canvas.unbind("mousemove");
              canvas.removeClass('hand');
              }
              }).mousemove(function(e){
              var offset = canvas.offset(), x, y;
              x = e.pageX - offset.left;
              y = e.pageY - offset.top;
              canvas.toggleClass('hand', seed.hover(x, y));
              });

              var seedAnimate = eval(Jscex.compile("async", function () {
              seed.draw();
              while (hold) {
              $await(Jscex.Async.sleep(10));
              }
              while (seed.canScale()) {
              seed.scale(0.95);
              $await(Jscex.Async.sleep(10));
              }
              while (seed.canMove()) {
              seed.move(0, 1.5); // Уменьшили скорость/шаг падения
              foot.draw();
              $await(Jscex.Async.sleep(10));
              }
              }));

        var growAnimate = eval(Jscex.compile("async", function () {
            do {
              tree.grow();
                $await(Jscex.Async.sleep(10));
            } while (tree.canGrow());
        }));

        var flowAnimate = eval(Jscex.compile("async", function () {
            do {
              tree.flower(2);
                $await(Jscex.Async.sleep(10));
            } while (tree.canFlower());
        }));

        var moveAnimate = eval(Jscex.compile("async", function () {
            tree.snapshot("p1", 240, 0, 610, 680);
            while (tree.move("p1", 500, 0)) {
                foot.draw();
                $await(Jscex.Async.sleep(10));
            }
            foot.draw();
            tree.snapshot("p2", 500, 0, 610, 680);

            // 会有闪烁不得意这样做, (＞﹏＜)
            canvas.parent().css("background", "url(" + tree.toDataURL('image/png') + ")");
            canvas.css("background", "#ffe");
            $await(Jscex.Async.sleep(300));
            canvas.css("background", "none");
        }));

        var jumpAnimate = eval(Jscex.compile("async", function () {
            var ctx = tree.ctx;
            while (true) {
                tree.ctx.clearRect(0, 0, width, height);
                tree.jump();
                foot.draw();
                $await(Jscex.Async.sleep(25));
            }
        }));

        var textAnimate = eval(Jscex.compile("async", function () {
            var together = new Date();
            together.setFullYear(2009,10,23 );
            together.setHours(16);
            together.setMinutes(53);
            together.setSeconds(0);
            together.setMilliseconds(2);

            $("#code").show();
            $("#clock-box").fadeIn(500);
            
            var lines = $(".poem-line");
            var inkWash = $(".ink-wash");
            
            // Set initial state
            lines.css({"display": "block", "opacity": "0"});

            for (var i = 0; i < lines.length; i++) {
                var line = $(lines[i]);
                var zhChars = line.find(".zh-text span");
                var en = line.find(".en-text");

                // Phase I: Birth and Focus
                inkWash.css("opacity", 1);
                line.css({
                    "position": "fixed",
                    "top": "50%",
                    "left": "50%",
                    "transform": "translate(-50%, -50%) scale(2)",
                    "opacity": "1"
                });
                
                $await(Jscex.Async.sleep(1500));

                // Phase II: Docking
                line.css({
                    "position": "relative",
                    "top": "auto",
                    "left": "auto",
                    "transform": "translate(0,0) scale(1)"
                });
                en.css("opacity", 1);
                inkWash.css("opacity", 0);
                
                $await(Jscex.Async.sleep(1000));
            }

            // Phase III: Footer
            $(".footer-info").css("opacity", 1);
            
            // Phase IV: Final Stamp
            $await(Jscex.Async.sleep(500));
            $(".red-seal").css({
                "opacity": 1,
                "transform": "rotate(-5deg) scale(1)"
            });

            while (true) {
                timeElapse(together);
                $await(Jscex.Async.sleep(1000));
            }
        }));

        var runAsync = eval(Jscex.compile("async", function () {
            $await(seedAnimate());
            $await(growAnimate());
            $await(flowAnimate());
            $await(moveAnimate());

            textAnimate().start();

            $await(jumpAnimate());
        }));

        runAsync().start();
    })();
    </script>

    </body></html>
